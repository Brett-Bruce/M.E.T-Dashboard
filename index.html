<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Title</title>
    <link rel="stylesheet" href="MET1976.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <button id="lang-toggle">Es</button>
        <h2><span data-key="welcome">Current Time: </span> <span id="live-clock">00:00:00</span></h2>

        <script>
            function updateClock() {
                const now = new Date(); // Gets the user's current system time
                
                // Format the time directly to the user's local standard
                const timeString = now.toLocaleTimeString();
                
                // Inject the time string straight into the HTML container
                document.getElementById('live-clock').textContent = timeString;
            }

            // Run the clock immediately on page load
            updateClock();

            // Update the clock container precisely every 1000 milliseconds (1 second)
            setInterval(updateClock, 1000);
        </script>

    </header>

    <main>
        <article>
            <h1>M.E.T <br>1976</h1>
            <nav>
                <ul>
                    <div class="link-container">
                        <li><a data-key="gs" href="GS_calculator.html">G.S Calculator</a></li>
                        <li><a data-key="bay"  href="bay_counter.html">G.S Bay Counter</a></li>
                        <li><a data-key="hours"  href="hours_calculator.html">Friday</a></li>
                    </div>
                </ul>
            </nav>
        </article> 
    </main>
    <script src="espanol.js" defer></script>

</body>
</html>
