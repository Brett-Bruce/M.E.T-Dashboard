<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Title</title>
    <link rel="stylesheet" href="GS_calculator.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <button id="lang-toggle">Español</button>
        <h1 data-key="gs">G.S Calculator</h1>
        <nav>
            <form id="gs_calc_form">
                <div class="gs_calc">
                    <div class="variables">
                        <label data-key="totalgs">
                            Enter Total G.S
                        </label>
                        <input type="number" id="total_gs" required>
                        <label data-key="compbays">
                            Enter # of Completed Bays
                        </label>
                        <input type="number"  id="completed_bays" required>
                        <label data-key="ts">
                            Enter the Team Size
                        </label>
                        <input type="number" id="team_size" required>
                        <button data-key="submit" id="submit" type='submit'>Submit</button>
                    </div>

                    <div class="percent">
                        <label id="percent_label"> </label>
                    </div>
                    <div class="slider_ui">
                        <input type="range" id="dynamic_slider" style="opacity: 0;" min="1" max="100" step="1" disabled>
                        <output id="sliderValue"></output>
                    </div>
                    <div class="slider_value">
                        <label id="slider_label"></label>
                    </div>
                </div>
            </form>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main>
        <article>
            <h2>
                <ul>
                    <div class="link-container">
                        <li><a data-key="bay" href="bay_counter.html">G.S Bay Counter</a></li>
                        <li><a data-key="hours" href="hours_calculator.html">Friday</a></li>
                        <li><a data-key="home" href="index.html">Home</a></li>
                    </div>
                </ul>
            </h2>
        </article>
    </main>
    <script src="espanol.js" defer></script>
    <script src="calculator.js"></script>
</body>
</html>
